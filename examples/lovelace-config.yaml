# ---------------------------------------------------------------------------
# Solar Dashboard Card — sample Lovelace configuration
# ---------------------------------------------------------------------------
# Paste this into a dashboard view (YAML mode) or use the "Manual" card and
# replace the entity IDs / images / node positions to match your system.
# All image paths MUST use /local/ (mapped to <config>/www/), never Windows paths.
# ---------------------------------------------------------------------------

type: custom:solar-dashboard-card
title: Solar Energy            # optional header (omit for none)

# --- Core energy entities ---------------------------------------------------
solar_generation_sensor: sensor.goodwe_pv_power
load_power_sensor: sensor.goodwe_house_consumption
battery_charge_sensor: sensor.battery_charging_2
battery_discharge_sensor: sensor.battery_discharging
battery_soc_sensor: sensor.goodwe_battery_state_of_charge
battery_soh_sensor: sensor.goodwe_battery_state_of_health

# Grid. These keys are aliases — the value mapped to *import* is power drawn
# FROM the grid (Grid -> Home); *export* is power sent TO the grid (Solar -> Grid).
grid_feed_in_sensor: sensor.grid_import_power      # = grid_import_sensor
grid_consumption_sensor: sensor.grid_export_power  # = grid_export_sensor
# Or use the explicit semantic keys instead (these take precedence):
# grid_import_sensor: sensor.grid_import_power
# grid_export_sensor: sensor.grid_export_power

# --- Weather / day-night image switching ------------------------------------
weather_entity: weather.raceview
sunrise_sensor: sensor.raceview_astronomical_sunrise_time_0
sunset_sensor: sensor.raceview_astronomical_sunset_time_0
day_cycle_boolean: input_boolean.energy_house_image_day_cycle   # off = always day image
details_overlay_boolean: input_boolean.energy_vision_details    # on = show details grid

# --- Cost cards -------------------------------------------------------------
tariff_mode: single            # single | tou  (see the TOU block below for time-of-use)
import_tariff: 0.24            # used in single mode
export_tariff: 0.40            # feed-in credit — always a single flat rate
daily_connection_fee: 0.98     # $/day fixed grid supply charge (× days in the period)
cost_period: both              # quarter | month | both
month_start_day: 1             # billing month starts on this day
quarter_start_date: 2026-07-01 # quarter anchor (YYYY-MM-DD or MM-DD); blank = Jan 1
quarter_days: 91               # legacy fallback only
# For ACCURATE costs, point each period at kWh totals (see examples/energy-meters.yaml):
# import_energy_month_sensor: sensor.grid_import_energy_month
# export_energy_month_sensor: sensor.grid_export_energy_month
# import_energy_quarter_sensor: sensor.grid_import_energy_quarter
# export_energy_quarter_sensor: sensor.grid_export_energy_quarter

# --- Time-of-use tariff -----------------------------------------------------
# Only used when tariff_mode: tou (above). Each band has a $/kWh rate and a
# "windows" string of 24h ranges: "HH:MM-HH:MM", comma-separated for multiple
# windows, and a range may wrap past midnight (e.g. 22:00-06:00).
#   * Off-peak is the CATCH-ALL — any time not matched by free/peak/shoulder is
#     billed at the off-peak rate, so you don't have to cover all 24h exactly.
#   * Free (when enabled) overrides every band at $0 during its windows.
# The report's Cost tab splits your real imported-kWh history into these bands
# by the actual time it happened, so its figure is exact. The always-on cost
# card has no time breakdown, so it shows a duration-weighted AVG rate instead.
# tariff_mode: tou
# tou:
#   peak:
#     rate: 0.45
#     windows: "15:00-21:00"
#   shoulder:
#     rate: 0.30
#     windows: "07:00-15:00,21:00-22:00"
#   offpeak:
#     rate: 0.20
#     windows: "22:00-07:00"     # optional — off-peak is the catch-all anyway
#   free:
#     enabled: true
#     windows: "11:00-14:00"     # billed at $0 while enabled

# --- Flow colours -----------------------------------------------------------
# Per-direction flow-dot colours (each unset key uses its built-in default):
flow_colors:
  solar_home: "#21e065"
  solar_battery: "#21e065"
  solar_grid: "#21e065"
  battery_home: "#38d39f"
  grid_home: "#ffc233"
  grid_battery: "#7c5cff"
  battery_grid: "#b06bff"

# --- Node colours -----------------------------------------------------------
# Accent colour each node lights up with when active. Home is the house glow
# (set home_glow_color below), so it has no entry here.
node_colors:
  solar: "#f5c542"
  battery: "#38d39f"
  grid: "#ff5d5d"

# --- Home glow (house) ------------------------------------------------------
home_glow_enabled: true
home_glow_color: "#ffcf6b"     # warm glow; lit/pulses when the home is consuming
home_glow_blur: 14             # px
# Mode A (default): radial-box glow positioned over the house
home_glow:
  x: 46    # centre X (% of image)
  y: 36    # centre Y (%)
  w: 58    # width (%)
  h: 52    # height (%)
# Mode B (precise): transparent PNG of just the house — glow hugs its outline.
# When set, this replaces the radial box above. See README for how to make it.
# house_overlay_image: /local/HouseOverlay.png

# --- Behaviour --------------------------------------------------------------
poll_interval: 10     # seconds
use_rest: false       # set true to also poll /api/states (usually unnecessary)
solar_label: Solar

# --- Reporting / statistics -------------------------------------------------
show_graphs: true
graphs_collapsed: false
graph_poll_interval: 300   # seconds between history refreshes
report_default_range: today # today | yesterday | 7d | 30d | billing_month | billing_quarter
report_default_tab: overview
report_show_previous: true

# Battery analytics + full-time forecast
battery_capacity_kwh: 9.6
battery_reserve_soc: 20
battery_full_soc: 100
battery_charge_efficiency: 0.92
# Optional forecast sensors (kWh remaining from now)
# solar_forecast_remaining_sensor: sensor.energy_production_today_remaining
# load_forecast_remaining_sensor: sensor.house_load_forecast_remaining

# Optional inverter capacity for "near clipping" reporting
# solar_inverter_ac_capacity_w: 5000

# Optional kWh-today sensors override the integrated estimates for accuracy:
# pv_energy_today_sensor: sensor.goodwe_pv_energy_today
# load_energy_today_sensor: sensor.goodwe_house_consumption_today
# import_energy_today_sensor: sensor.grid_import_energy_today
# export_energy_today_sensor: sensor.grid_export_energy_today
# battery_charge_energy_today_sensor: sensor.battery_charge_energy_today
# battery_discharge_energy_today_sensor: sensor.battery_discharge_energy_today

# Optional custom metrics shown on the Metrics tab:
# metrics:
#   - key: pool_pump
#     label: Pool pump
#     entity: sensor.pool_pump_power
#     type: power
#     aggregate: integrate
#     chart: appliances
#     color: "#00d2d3"
#   - key: hot_water
#     label: Hot water temp
#     entity: sensor.hot_water_temperature
#     type: temp
#     aggregate: avg
#     unit: "°C"
#     chart: temperatures
#     color: "#ff9f43"

# --- Images (weather + day/night) -------------------------------------------
images:
  default: /local/Sunny.png
  sunny_day: /local/Sunny.png
  rainy_day: /local/Raining.png
  lightning_rainy_day: /local/Thunderstorm.png
  cloudy_day: /local/Cloudy.png
  partly_cloudy_day: /local/Cloudy.png
  fog_day: /local/Cloudy.png
  clear_night: /local/Night.png
  # Optional. If omitted, cloudy/fog at night falls back to the matching day image.
  # cloudy_night: /local/Night Cloudy.png
  # partly_cloudy_night: /local/Night Cloudy.png
  # fog_night: /local/Night Cloudy.png
  rainy_night: /local/Night Raining.png
  lightning_rainy_night: /local/Night Thunderstorm.png

# --- Node positions (percentages of the image, 0-100) -----------------------
# Tune these to line up with YOUR house image.
nodes:
  solar:           # over the roof solar panels
    x: 36
    y: 21
  home:            # invisible anchor — where home-bound flows converge (no bubble)
    x: 46
    y: 40
  battery:         # over the wall battery unit
    x: 29
    y: 50
  grid:            # over the power pole
    x: 18
    y: 34

# ---------------------------------------------------------------------------
# Extended/detail entities (only rendered when details_overlay_boolean is "on")
# ---------------------------------------------------------------------------
inverter_temp_sensor: sensor.goodwe_inverter_temperature_module
ambient_temp_sensor: sensor.goodwe_inverter_temperature_air
battery_temp_sensor: sensor.goodwe_battery_temperature
cell_temp_low_sensor: sensor.goodwe_battery_min_cell_temperature
cell_temp_high_sensor: sensor.goodwe_battery_max_cell_temperature
grid_voltage_sensor: sensor.goodwe_on_grid_l1_voltage
grid_current_sensor: sensor.goodwe_on_grid_l1_current
inverter_fault_sensor: sensor.goodwe_errors
inverter_state_sensor: sensor.goodwe_grid_mode
work_mode_select: sensor.goodwe_work_mode
pv1_power_sensor: sensor.goodwe_pv1_power
pv1_current_sensor: sensor.goodwe_pv1_current
pv1_voltage_sensor: sensor.goodwe_pv1_voltage
pv2_power_sensor: sensor.goodwe_pv2_power
pv2_current_sensor: sensor.goodwe_pv2_current
pv2_voltage_sensor: sensor.goodwe_pv2_voltage
pv3_power_sensor: sensor.goodwe_pv3_power
pv3_current_sensor: sensor.goodwe_pv3_current
pv3_voltage_sensor: sensor.goodwe_pv3_voltage
pv4_power_sensor: sensor.goodwe_pv4_power
pv4_current_sensor: sensor.goodwe_pv4_current
pv4_voltage_sensor: sensor.goodwe_pv4_voltage
